<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servette — Source</title>
<!--
  Servette source viewer — a read-only literate notebook over Servette's
  authored Markdown sources. The whole app is one file, index.html. It fetches
  src/*.md from the repository at render time (?ref= selects the git ref) and
  projects them as notebook cells; there is no generated copy to go stale.

  Grown from the notebook shell (andy-emerson/notebook, index.html) by
  removing its target and its identity: the cartridge seam, runtime, agent,
  editing, and persistence are gone; the doc model, markdown pipeline, cell
  DOM, Outline, and pane machinery remain. Read-only by design — the
  view/edit fork is resolved at authoring time, not exposed to readers.
  The dress is servette.org's: its palette and data-theme mechanism replace
  the shell's Paper × Ink engine.

  ── Architecture ────────────────────────────────────────────────────────────
  The src/*.md files (in build.py order) are the single source of truth.
  The viewer is a projection over them (fenced code blocks = code cells with a
  language; prose runs = markdown cells):

      parse(md) -> cells      // per file; serialize() retained as the check

  serialize(parse(x)) === x — the byte-exact round-trip is kept (and
  self-tested) even though nothing here writes: it is the proof the viewer
  shows the file, not a reformatting of it.

  Every dependency degrades: no marked → the built-in renderer; no
  CodeMirror → a plain <pre>; a failed file fetch → an inline error in that
  file's slot while the rest of the document stands.

  ── Contents ────────────────────────────────────────────────────────────────
  <style>  CSS, numbered as in the shell (removed sections keep their gaps):
    1 Base & reset   2 Theme variables   3 Layout   4 Topbar   5 Status bar
    6 Notebook + cells   7 Panels (left pane)   8 Right pane (Preview)
    9 Markdown output   10 Toast
  <script> JS:
    0 Icons   1 Doc model (parse/serialize)   2 Markdown   3 Sources (fetch)
    4 Theme   5 CodeMirror   6 Cell DOM   6c Preview
    6b Navigator (file accordion + search)   6d Refs (tags & branches)
    9 Self-tests   10 Wiring + boot
  (Each section is marked by a ════ banner; this list is its table of contents.)
-->

<!-- marked.js for Markdown is loaded NON-blocking at boot (see loadMarked());
     a built-in renderer is used until/if it arrives, so the UI never waits on a CDN. -->

<!-- CodeMirror 6 — loaded on demand via dynamic import(); <pre> fallback if offline.
     The editing packages (commands, autocomplete) are gone with the editing. -->
<script type="importmap">
{
  "imports": {
    "@codemirror/view":                "https://esm.sh/@codemirror/view@6",
    "@codemirror/state":               "https://esm.sh/@codemirror/state@6",
    "@codemirror/language":            "https://esm.sh/@codemirror/language@6",
    "@codemirror/lang-python":         "https://esm.sh/@codemirror/lang-python@6",
    "@lezer/highlight":                "https://esm.sh/@lezer/highlight@1"
  }
}
</script>

<script>
  /* Set the palette before first paint so the page never flashes the wrong
     one — the front door's script, verbatim, including its storage key, so
     a theme chosen on servette.org carries into this page (same origin,
     same preference). The picker in the topbar takes over from here. */
  (function () {
    var pref;
    try { pref = localStorage.getItem("servette-theme"); } catch (e) {}
    if (pref !== "light" && pref !== "dark") pref = "system";
    var dark = pref === "dark" || (pref === "system" && window.matchMedia
      && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>

<style>
/* ════════════════════════════════════════════════════════════════════════════
 * 1. BASE & RESET
 * ════════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 99px; }
* { scrollbar-color: var(--border-medium) transparent; scrollbar-width: thin; }

/* ════════════════════════════════════════════════════════════════════════════
 * 2. THEME — servette.org's palette on the shell's token names.
 *
 *   The shell's Paper × Ink engine (sliders, OKLCH math, halo) is removed;
 *   these are the same custom properties its components consume, now defined
 *   statically from the front door's palette. Light is the default; dark is
 *   the same tokens redefined under [data-theme="dark"], which the JS theme
 *   toggle sets (system preference at boot, sticky manual override) — the
 *   front door's mechanism, verbatim.
 * ════════════════════════════════════════════════════════════════════════════ */
:root {
  --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;
  --radius-md: 8px;
  --radius-lg: 12px;
  --green-2:   #5A8466;   /* the logo's green — same in both themes, like the front door */
  --acc-code:  #4d7358;   /* servette green — code accents (badges, dots) */
  --acc-prose: #857f76;   /* warm gray — prose accents */
  /* Functional colors — fixed hues (Tailwind-500 solids), named by hue. Each
     -bg tint (18%) and -border ring (35%) is DERIVED from the solid via
     color-mix. green=ok · amber=busy · red=error. */
  --fn-green: #22c55e;  --fn-green-bg: color-mix(in srgb, var(--fn-green) 18%, transparent);
                        --fn-green-border: color-mix(in srgb, var(--fn-green) 35%, transparent);
  --fn-amber: #f59e0b;  --fn-amber-bg: color-mix(in srgb, var(--fn-amber) 18%, transparent);
                        --fn-amber-border: color-mix(in srgb, var(--fn-amber) 35%, transparent);
  --fn-red:   #ef4444;  --fn-red-bg:   color-mix(in srgb, var(--fn-red)   18%, transparent);
                        --fn-red-border:   color-mix(in srgb, var(--fn-red)   35%, transparent);

  --bg-primary:    #ffffff;   /* cells, panes (surface) */
  --bg-secondary:  #f1efeb;   /* headers, chrome */
  --bg-tertiary:   #faf9f7;   /* the page behind the cells */
  --bg-info:       #f1efeb;
  --text-primary:  #1c1b1a;
  --text-secondary:#4a4845;
  --text-tertiary: #857f76;
  --border-faint:  rgba(28,27,26,.10);
  --border-light:  rgba(28,27,26,.18);
  --border-medium: rgba(28,27,26,.30);
  --border-info:   #4d7358;
  --syntax-keyword:  #7c5cbf;
  --syntax-number:   #a86a3c;
  --syntax-function: #2f5d8a;
  --syntax-string:   #4d7358;
  --syntax-operator: #4a4845;
}
[data-theme="dark"] {
  --acc-code:  #7BA888;
  --acc-prose: #6f6a63;

  --bg-primary:    #161616;
  --bg-secondary:  #131313;
  --bg-tertiary:   #0e0e0e;
  --bg-info:       #131313;
  --text-primary:  #e8e8e8;
  --text-secondary:#a8a49e;
  --text-tertiary: #6f6a63;
  --border-faint:  rgba(232,232,232,.10);
  --border-light:  rgba(232,232,232,.18);
  --border-medium: rgba(232,232,232,.30);
  --border-info:   #7BA888;
  --syntax-keyword:  #b39ddb;
  --syntax-number:   #cf9058;
  --syntax-function: #82aed6;
  --syntax-string:   #9bc4a5;
  --syntax-operator: #a8a49e;
}

/* ════════════════════════════════════════════════════════════════════════════
 * 3. LAYOUT
 * ════════════════════════════════════════════════════════════════════════════ */
html, body { height: 100%; }
body { font-family: var(--font-sans); background: var(--bg-tertiary); color: var(--text-primary); transition: background .2s, color .2s; -webkit-font-smoothing: antialiased; }
/* The grain the front door wears, at the same weight. Fixed and inert, so it
   sits under everything without intercepting a single click. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  opacity: 0.4;
  z-index: 0;
}
body > * { position: relative; z-index: 1; }
::selection { background: color-mix(in oklab, var(--border-info) 30%, transparent); }
:focus-visible { outline: 2px solid var(--border-info); outline-offset: 2px; border-radius: 4px; }
#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
#main-area { display: flex; flex: 1; min-height: 0; }

.activity-bar { width: 44px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 4px 0; background: var(--bg-secondary); z-index: 5; }
#left-activity-bar { border-right: .5px solid var(--border-faint); }
#right-activity-bar { border-left: .5px solid var(--border-faint); }
.activity-bar-btn { width: 44px; height: 42px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: var(--text-tertiary); border-right: 2px solid transparent; transition: color .12s; }
#right-activity-bar .activity-bar-btn { border-right: none; border-left: 2px solid transparent; }
.activity-bar-btn:hover { color: var(--text-primary); }
.activity-bar-btn.active { color: var(--text-primary); border-right-color: var(--border-info); }
#right-activity-bar .activity-bar-btn.active { border-left-color: var(--border-info); border-right-color: transparent; }
.activity-bar-btn svg { width: 19px; height: 19px; }

#left-pane { width: 248px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--bg-primary); overflow: hidden; transition: width .18s ease; }
#left-pane.collapsed { width: 0 !important; }
#right-pane { width: 460px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--bg-primary); overflow: hidden; transition: width .18s ease; }
#right-pane.collapsed { width: 0 !important; }

.pane-resizer { width: 9px; flex-shrink: 0; position: relative; cursor: col-resize; background: transparent; z-index: 10; }
.pane-resizer::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: .5px; background: var(--border-faint); transition: background .15s; }
.pane-resizer:hover::before, .pane-resizer.dragging::before { background: var(--border-medium); }

/* ════════════════════════════════════════════════════════════════════════════
 * 4. TOPBAR
 * ════════════════════════════════════════════════════════════════════════════ */
.topbar { display: flex; align-items: center; gap: 6px; padding: 0 14px; background: var(--bg-primary); border-bottom: .5px solid var(--border-faint); flex-shrink: 0; height: 52px; }
.topbar-logo { display: flex; align-items: center; gap: 10px; margin-right: 8px; user-select: none; }
.topbar-logo a { text-decoration: none; }
/* The front door's logo, verbatim: set in text so the cursor can blink and
   both palettes are served by one mark. */
.logo { font-family: var(--font-mono); font-weight: 500; letter-spacing: 0; line-height: 1; color: var(--text-primary); white-space: nowrap; font-size: 25px; }
.logo .ette { color: var(--green-2); }
.logo .cursor { color: inherit; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .logo .cursor { animation: none; } }
.topbar-logo .src-tag { font-family: var(--font-mono); font-size: 12px; color: var(--acc-code); border: 1px solid color-mix(in srgb, var(--acc-code) 35%, transparent); border-radius: 99px; padding: 2px 9px; }
.topbar-sep { flex: 1; }
.tb-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tb-group-btns { display: flex; align-items: center; gap: 2px; }
.tb-group-label { font-size: 9px; color: var(--text-tertiary); letter-spacing: .06em; text-transform: uppercase; line-height: 1; padding-bottom: 3px; }
.tb-divider { width: .5px; height: 28px; align-self: center; background: var(--border-faint); margin: 0 4px; }
.tb-btn { background: none; border: .5px solid var(--border-light); border-radius: var(--radius-md); padding: 6px 10px; font-size: 12px; font-family: var(--font-sans); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 5px; transition: background .12s, color .12s; white-space: nowrap; }
.tb-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }
.tb-btn.icon-only { padding: 6px; }  /* no label inside — the word lives in the group caption below */
.tb-btn.icon-only svg { width: 15px; height: 15px; }
.tb-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

/* The front door's theme picker — a segmented control built from radios —
   ported onto the shell's tokens (surface→bg-primary, border→border-light,
   muted→text-tertiary, green→border-info). */
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
.theme-picker { display: flex; align-items: center; gap: 2px; margin: 0; padding: 2px; border: 1px solid var(--border-light); border-radius: 9px; background: var(--bg-secondary); }
.theme-picker input { position: absolute; opacity: 0; pointer-events: none; }
.theme-picker label { display: grid; place-items: center; width: 30px; height: 26px; border-radius: 7px; border: 1px solid transparent; color: var(--text-tertiary); cursor: pointer; font: 400 13px/1 var(--font-mono); user-select: none; }
.theme-picker label:hover { color: var(--text-primary); }
.theme-picker input:checked + label { background: var(--bg-primary); border-color: var(--border-light); color: var(--text-primary); }
/* The radios are visually hidden, so the focus ring has to be drawn on
   the label they control or keyboard users get nothing. */
.theme-picker input:focus-visible + label { outline: 2px solid var(--border-info); outline-offset: 1px; }

/* ════════════════════════════════════════════════════════════════════════════
 * 5. STATUS BAR
 * ════════════════════════════════════════════════════════════════════════════ */
.status-bar { display: flex; align-items: center; height: 26px; flex-shrink: 0; background: var(--bg-secondary); border-top: .5px solid var(--border-faint); padding: 0 10px; gap: 6px; font-size: 11px; user-select: none; }
.status-item { display: flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; color: var(--text-tertiary); background: var(--bg-primary); border: .5px solid var(--border-faint); white-space: nowrap; transition: color .15s, background .15s, border-color .15s; }
.status-item.working { color: var(--fn-amber); background: var(--fn-amber-bg); border-color: var(--fn-amber-border); }
.status-item.ready { color: var(--fn-green); background: var(--fn-green-bg); border-color: var(--fn-green-border); }
.status-item.error { color: var(--fn-red); background: var(--fn-red-bg); border-color: var(--fn-red-border); }
.status-spacer { flex: 1; }
.status-link { cursor: pointer; }
.status-link:hover { color: var(--text-primary); }

/* ════════════════════════════════════════════════════════════════════════════
 * 6. NOTEBOOK + CELLS
 * ════════════════════════════════════════════════════════════════════════════ */
#nb-body { flex: 1; min-width: 0; overflow-y: auto; }
#nb-scroll { min-height: 100%; padding: 14px 0 40vh; max-width: 940px; margin: 0 auto; }

/* The 26px bottom margin is the shell's inter-cell insert zone, kept as pure
   breathing room — the insert affordance left with the editing. */
.cell { margin: 0 16px 26px; position: relative; border-radius: var(--radius-lg); border: .5px solid var(--border-faint); background: var(--bg-primary); overflow: hidden; transition: border-color .15s; }
.cell.focused { border-color: var(--border-info); }
.cell-header { display: flex; align-items: center; gap: 7px; padding: 6px 11px; background: var(--bg-secondary); border-bottom: .5px solid var(--border-faint); position: relative; user-select: none; }
.cell-header .ca-btn { cursor: pointer; }
.cell-badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px; letter-spacing: .05em; text-transform: uppercase; display: flex; align-items: center; gap: 4px; flex-shrink: 0; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); }
.badge-code { background: color-mix(in srgb, var(--acc-code) 15%, transparent); color: var(--acc-code); }
.badge-md { background: color-mix(in srgb, var(--acc-prose) 20%, transparent); color: var(--acc-prose); }
.cell-title { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-actions { display: flex; gap: 3px; opacity: 0; transition: opacity .15s; }
.cell:hover .cell-actions, .cell.focused .cell-actions { opacity: 1; }
.ca-btn { background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 3px 5px; border-radius: 5px; display: flex; align-items: center; transition: background .1s, color .1s; }
.ca-btn:hover { background: var(--bg-primary); color: var(--text-primary); }
.ca-btn svg { width: 16px; height: 16px; }

.cell-editor .cm-editor { height: auto; }
.cell-editor .cm-editor.cm-focused { outline: none; }
.cell-editor .cm-scroller { overflow-x: auto; font-family: var(--font-mono); }
/* Fallback code view when CodeMirror never arrives (offline / blocked CDN). */
.cell-editor pre.code-plain { font-family: var(--font-mono); font-size: 13px; line-height: 1.65; padding: 11px 13px; margin: 0; overflow-x: auto; color: var(--text-primary); }

/* collapse */
.cell.collapsed .cell-editor, .cell.collapsed .cell-output { display: none; }
.cell.collapsed .cell-header { border-bottom: none; }

/* rendered prose */
.cell-output { font-size: 14px; line-height: 1.7; }
.cell-output.out-md { padding: 6px 16px; }

/* file boundary — one slim row per src/*.md file, linking to the file on GitHub */
.file-row { display: flex; align-items: baseline; gap: 10px; margin: 26px 16px 10px; padding: 0 2px 6px; border-bottom: .5px solid var(--border-light); }
.file-row:first-child { margin-top: 6px; }
.file-row .fname { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--text-primary); }
.file-row .fsub { font-size: 11px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row a { margin-left: auto; font-size: 11px; color: var(--text-tertiary); text-decoration: none; flex-shrink: 0; }
.file-row a:hover { color: var(--text-primary); text-decoration: underline; }


/* ════════════════════════════════════════════════════════════════════════════
 * 7. PANELS (left pane)
 * ════════════════════════════════════════════════════════════════════════════ */
.pane-header { flex-shrink: 0; padding: 9px 14px; font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; border-bottom: .5px solid var(--border-faint); background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; }
.pane-header .mini { cursor: pointer; color: var(--text-tertiary); display: flex; }
.pane-header .mini:hover { color: var(--text-primary); }
.pane-header .mini svg { width: 14px; height: 14px; }
.pane-panel { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
.pane-panel.active { display: flex; }
.pane-empty { color: var(--text-tertiary); font-size: 12px; font-style: italic; padding: 12px 14px; }
/* Centered empty-state for a wholly empty panel/tab (ported from the oracle's .pane-placeholder). */
.pane-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; flex: 1; min-height: 140px; color: var(--text-tertiary); font-size: 12px; text-align: center; line-height: 1.6; padding: 20px 14px; }
.pane-placeholder svg { width: 28px; height: 28px; opacity: 0.35; margin-bottom: 4px; }
.pane-placeholder .pp-hint { font-size: 11px; opacity: 0.6; }
/* Let a list-wrap fill its pane when it holds only an empty-state, so the placeholder centers vertically too. */
#outline-list:has(> .pane-placeholder) { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
.list-row { display: flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 12px; cursor: default; border-bottom: .5px solid var(--border-faint); }
.list-row:hover { background: var(--bg-secondary); }
.list-row .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .mono { font-family: var(--font-mono); }
.list-row .sub { color: var(--text-tertiary); font-size: 10px; }
.list-row.clickable { cursor: pointer; }
.list-row.file { font-weight: 700; border-bottom-color: var(--border-light); }
.list-row.indent { padding-left: 26px; }

/* nav search — the shell's .lib-add row */
.nav-search { display: flex; gap: 6px; padding: 10px 12px; border-bottom: .5px solid var(--border-faint); }
.nav-search input { flex: 1; min-width: 0; padding: 5px 8px; border: .5px solid var(--border-light); border-radius: 6px; background: var(--bg-secondary); color: var(--text-primary); font-size: 12px; font-family: var(--font-mono); outline: none; }
.nav-search input:focus { border-color: var(--border-info); }

/* file accordion — the shell's Settings collapse convention: a chevron that
   points right collapsed, down expanded. */
.nav-chev { display: inline-flex; flex-shrink: 0; color: var(--text-tertiary); transition: transform .15s; }
.nav-chev svg { width: 13px; height: 13px; }
.list-row.file.expanded .nav-chev { transform: rotate(90deg); }

/* refs panel */
.refs-group { padding: 10px 14px 4px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); }
.list-row .ref-ico { display: flex; color: var(--text-tertiary); }
.list-row .ref-ico svg { width: 14px; height: 14px; }
.list-row .cur { color: var(--fn-green); font-size: 10px; }
.pane-note { font-size: 10px; color: var(--text-tertiary); font-style: italic; padding: 6px 14px; }

/* outline */
.ol-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ol-dot.code { background: var(--acc-code); }
.ol-dot.md   { background: var(--acc-prose); }
@keyframes cellflash { 0%,100% { box-shadow: 0 0 0 0 transparent; } 30% { box-shadow: 0 0 0 2px var(--border-info); } }
.cell.flash { animation: cellflash .7s ease; }



/* ════════════════════════════════════════════════════════════════════════════
 * 8. RIGHT PANE — Preview: the sources rendered as one continuous document,
 *    without cell chrome. Toggled by its activity-bar button.
 * ════════════════════════════════════════════════════════════════════════════ */
.right-panel { display: flex; flex: 1 1 0; min-height: 60px; flex-direction: column; }
.right-panel .rp-header { flex-shrink: 0; padding: 7px 12px; font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; border-bottom: .5px solid var(--border-faint); background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.out-md { color: var(--text-primary); white-space: normal; }

.out-md h1, .out-md h2, .out-md h3 { font-family: var(--font-mono); font-weight: 500; letter-spacing: -0.02em; }
.out-md h1 { font-size: 22px; margin: 4px 0 12px; border-bottom: .5px solid var(--border-faint); padding-bottom: .2em; }
.out-md h2 { font-size: 17px; margin: 16px 0 7px; border-bottom: .5px solid var(--border-faint); padding-bottom: .2em; }
.out-md h3 { font-size: 14px; margin: 13px 0 5px; }
.out-md p { font-size: 14px; line-height: 1.7; margin-bottom: 9px; }
.out-md ul, .out-md ol { padding-left: 22px; font-size: 14px; margin-bottom: 9px; }
.out-md li { margin-bottom: 3px; line-height: 1.6; }
.out-md code { font-family: var(--font-mono); font-size: 12px; background: var(--bg-secondary); padding: 1px 5px; border-radius: 4px; }
.out-md pre { background: var(--bg-secondary); padding: 10px 12px; border-radius: var(--radius-md); overflow-x: auto; margin-bottom: 10px; position: relative; }
.out-md pre code { background: none; padding: 0; }
.code-copy-btn { position: absolute; top: 7px; right: 7px; opacity: 0; transition: opacity .15s; background: var(--bg-primary); border: .5px solid var(--border-light); border-radius: 6px; color: var(--text-tertiary); padding: 3px 6px; cursor: pointer; display: flex; align-items: center; }
.out-md pre:hover .code-copy-btn { opacity: 1; }
.code-copy-btn:hover { color: var(--text-primary); border-color: var(--border-medium); background: var(--bg-secondary); }
.code-copy-btn svg { width: 13px; height: 13px; }

 * so they read as callouts, not as quotes. */
.out-md blockquote { border-left: 3px solid var(--border-info); background: var(--bg-secondary); padding: 8px 12px; border-radius: 0 var(--radius-md) var(--radius-md) 0; color: var(--text-secondary); margin-bottom: 9px; }
.out-md blockquote p:last-child { margin-bottom: 0; }
.out-md a { color: var(--acc-code); text-decoration: none; }
.out-md a:hover { color: var(--text-primary); }
.out-md hr { border: none; border-top: .5px solid var(--border-light); margin: 14px 0; }
.out-md strong { font-weight: 600; }
.out-md table { border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
.out-md th, .out-md td { padding: 5px 10px; border: .5px solid var(--border-light); }
.out-md th { background: var(--bg-secondary); font-weight: 600; }

/* ════════════════════════════════════════════════════════════════════════════

 * ════════════════════════════════════════════════════════════════════════════ */
.toast { position: fixed; bottom: 38px; left: 50%; transform: translateX(-50%); background: var(--bg-primary); border: .5px solid var(--border-light); border-radius: var(--radius-md); padding: 8px 16px; font-size: 13px; color: var(--text-primary); box-shadow: 0 4px 16px rgba(0,0,0,.16); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 200; white-space: nowrap; }

 *
 *   parse(md)        -> { cells:[{id,type,lang,code,level,before,collapsed}], trailing }
 *   serialize(doc)   -> md

  v=String(v||'').trim();
  if(/^(https?:|mailto:|#)/i.test(v)) return true;
  if(isImg && /^data:image\//i.test(v)) return true;
  return !/^[a-z][a-z0-9+.-]*:/i.test(v);
}
function sanitizeHtml(html){
  const t=document.createElement('template'); t.innerHTML=String(html);
  for(const el of [...t.content.querySelectorAll('*')]){
    if(!MD_TAGS.has(el.tagName)){ el.replaceWith(...el.childNodes); continue; }
    for(const a of [...el.attributes]){
      const n=a.name.toLowerCase();
      if(!MD_ATTRS.has(n) || (n==='href' && !mdSafeUrl(a.value,false)) || (n==='src' && !mdSafeUrl(a.value,true))) el.removeAttribute(a.name);
    }
    if(el.tagName==='A'){ el.setAttribute('target','_blank'); el.setAttribute('rel','noopener'); }
  }
  return t.innerHTML;
}
function renderMarkdownHTML(src){
  if (window.marked && typeof marked.parse === 'function') {
    try { return sanitizeHtml(marked.parse(src, { breaks: false, gfm: true })); } catch(e){}
  }
  return sanitizeHtml(fallbackMarkdown(src));
}
// Load marked.js without blocking render; re-render md cells once it arrives.
function loadMarked(){
  if (window.marked) return;
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js';
  s.async = true;
  s.onload = () => refreshMarkdownCells();
  s.onerror = () => {};
  document.head.appendChild(s);
}
function refreshMarkdownCells(){
  $$('.cell').forEach(el => {
    const c = allCells().find(x => x.id === +el.dataset.id);
    if (c && c.type === 'md') renderMd(el, c);
  });
  if (rightOpen()) renderPreview();
}







/* ════════════════════════════════════════════════════════════════════════════
 * 3. SOURCES — the persistence layer's replacement. Nothing is stored: the
 *    authored src/*.md are fetched from the repository at render time, so what
 *    a reader sees is what is in the repository. ?ref= selects the git ref,
 *    validated (path-safe charset, no '..' segment) and pinned to REPO so a
 *    crafted link cannot fetch outside this repo's src/.
 * ════════════════════════════════════════════════════════════════════════════ */
const REPO  = 'andy-emerson/Servette';
const FILES = ['INIT.md', 'SERVER.md', 'SYSTEM.md', 'SHELL.md', 'MAIN.md'];   // build.py order
const _refParam = new URLSearchParams(location.search).get('ref') || 'main';
const REF = /^[A-Za-z0-9._\/-]+$/.test(_refParam) && !_refParam.split('/').includes('..')
  ? _refParam : 'main';
const RAW = `https://raw.githubusercontent.com/${REPO}/${REF}/src/`;

const nb = { files: [], cm: null, current: '', query: '' };   // files: [{name, raw, doc, error}] in FILES order
function allCells(){ return nb.files.flatMap(f => f.doc.cells); }
function currentFile(){ return nb.files.find(f => f.name === nb.current) || nb.files[0]; }
// The Navigator accordion is the file switcher: exactly one file is expanded,
// and ONLY that file's cells exist in the notebook DOM — five files' worth of
// live CodeMirror instances is weight a reader never sees the benefit of.
function expandFile(name, opts={}){
  if(!nb.files.some(f => f.name === name)) return;
  nb.current = name; lsSet('servette-src:file', name);
  renderNotebook(opts);
  $('#nb-body').scrollTop = 0;
}

function lsGet(k,d){ try { const v=localStorage.getItem(k); return v==null?d:v; } catch(e){ return d; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

// Fetch every file concurrently. A failed file degrades to an inline error
// callout in ITS slot — the rest of the document stands.
async function fetchSources(){
  setSource('loading', 'Source: fetching ' + REF + ' …');
  nb.files = await Promise.all(FILES.map(async name => {
    try {
      const res = await fetch(RAW + name);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const raw = await res.text();
      return { name, raw, doc: parse(raw) };
    } catch(e){
      return { name, raw: null, error: true,
               doc: parse('> **Could not load `src/' + name + '`** — ' + (e.message || e) +
                          '. The rest of the document is unaffected.') };
    }
  }));
  const saved = lsGet('servette-src:file','');
  nb.current = nb.files.some(f => f.name === saved) ? saved : FILES[0];
  const bad = nb.files.filter(f => f.error).length;
  if (bad === FILES.length) setSource('error', 'Source: ' + REF + ' unreachable');
  else if (bad)            setSource('error', 'Source: ' + REF + ' · ' + bad + ' file(s) failed');
  else                     setSource('ready', 'Source: ' + REF + ' · ' + FILES.length + ' files');
}

/* ════════════════════════════════════════════════════════════════════════════
 * 4. THEME — the front door's picker, ported: preference is one of
 *    light / dark / system (stored under the front door's own key, so the
 *    choice is shared across servette.org); data-theme only ever gets the
 *    resolved colour. Under "system" the page keeps listening, so a laptop
 *    flipping to dark at sunset moves this page with it. The pre-paint
 *    script in <head> applied the palette before first render; this takes
 *    over from there. Replaces the shell's Paper × Ink engine — the tokens
 *    it used to compute are now static CSS (see <style> §2).
 * ════════════════════════════════════════════════════════════════════════════ */
const _themeMedia = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function readThemePref(){
  const pref = lsGet('servette-theme', '');
  return pref === 'light' || pref === 'dark' ? pref : 'system';
}
function paintTheme(pref){
  const dark = pref === 'dark' || (pref === 'system' && _themeMedia && _themeMedia.matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
function setThemePref(pref){ lsSet('servette-theme', pref); paintTheme(pref); }
function wireThemePicker(){
  const inputs = $$('.theme-picker input');
  const initial = readThemePref();
  inputs.forEach(input => {
    input.checked = input.value === initial;
    input.addEventListener('change', () => { if (input.checked) setThemePref(input.value); });
  });
  if (_themeMedia){
    const onSystemChange = () => { if (readThemePref() === 'system') paintTheme('system'); };
    if (_themeMedia.addEventListener) _themeMedia.addEventListener('change', onSystemChange);
    else if (_themeMedia.addListener) _themeMedia.addListener(onSystemChange);
  }
}

/* ════════════════════════════════════════════════════════════════════════════
 * 5. CODEMIRROR 6 — loaded on demand; a plain <pre> is the fallback. Read-only:
 *    the editing extensions (history, brackets, keymaps) left with the editing.
 * ════════════════════════════════════════════════════════════════════════════ */
async function loadCM(){
  if (nb.cm) return nb.cm;
  if (nb.cm === false) return null;
  try {
    const [view,state,language,python,lezer] = await Promise.all([
      import('@codemirror/view'), import('@codemirror/state'),
      import('@codemirror/language'), import('@codemirror/lang-python'),
      import('@lezer/highlight'),
    ]);
    const { EditorView } = view;
    const { HighlightStyle, syntaxHighlighting } = language;
    const { tags } = lezer;
    const theme = EditorView.theme({
      '&': { fontSize:'13px', fontFamily:'var(--font-mono)', lineHeight:'1.65', background:'var(--bg-primary)', color:'var(--text-primary)' },
      '&.cm-focused': { outline:'none' },
      '.cm-content': { padding:'11px 13px', fontFamily:'inherit' },
      '.cm-scroller': { fontFamily:'inherit' },
      '&.cm-focused .cm-selectionBackground, .cm-selectionBackground': { background:'var(--bg-tertiary)' },
    });
    const highlight = syntaxHighlighting(HighlightStyle.define([
      { tag:[tags.keyword,tags.definitionKeyword,tags.controlKeyword,tags.operatorKeyword], color:'var(--syntax-keyword)' },
      { tag:[tags.string,tags.special(tags.string)], color:'var(--syntax-string)' },
      { tag:[tags.number,tags.bool,tags.atom], color:'var(--syntax-number)' },
      { tag:[tags.operator,tags.punctuation], color:'var(--syntax-operator)' },
      { tag:tags.comment, color:'var(--text-tertiary)', fontStyle:'italic' },
      { tag:[tags.function(tags.variableName),tags.function(tags.propertyName)], color:'var(--syntax-function)' },
      { tag:[tags.variableName,tags.propertyName], color:'var(--text-primary)' },
    ]));
    nb.cm = { view, state, language, python, theme, highlight };
    return nb.cm;
  } catch(e){
    nb.cm = false;   // CodeMirror unavailable (offline?) — cells stay plain <pre>
    return null;
  }
}
async function upgradeCode(cellEl, cell){
  const m = await loadCM();
  if (!m) return;
  const wrap = cellEl.querySelector('.cell-editor');
  const pre = wrap && wrap.querySelector('pre.code-plain');
  if (!pre) return;
  const { EditorView } = m.view;
  const { EditorState } = m.state;
  new EditorView({
    doc: cell.code,
    extensions: [
      m.theme, m.highlight,
      cell.lang === 'python' ? m.python.python() : [],
      EditorState.readOnly.of(true), EditorView.editable.of(false),
      EditorView.lineWrapping,
    ],
    parent: wrap,
  });
  pre.remove();
}

/* ════════════════════════════════════════════════════════════════════════════
 * 6. CELL DOM — read-only. Cells render once from the fetched doc; the only
 *    cell affordance left is collapse.
 * ════════════════════════════════════════════════════════════════════════════ */
function badgeLabel(cell){ return cell.type === 'md' ? 'Markdown' : (cell.lang || 'code').toUpperCase(); }
function firstLine(s){ const l=(s||'').split('\n').find(x=>x.trim()); return (l||'').trim().slice(0,60); }
function renderMd(cellEl, cell){
  const out=cellEl.querySelector('.cell-output');
  out.className='cell-output out-md';
  out.innerHTML = cell.code.trim()? renderMarkdownHTML(cell.code) : '';
}
function mkAction(ico,title,fn,cls){ const b=elem('button',{class:'ca-btn'+(cls?' '+cls:''),title,html:svg(ico)}); b.onclick=fn; return b; }
function createCellEl(cell){
  const badge=elem('span',{class:'cell-badge badge-'+cell.type,text:badgeLabel(cell)});
  const label = cell.type==='md' ? firstLine(cell.code).replace(/^#+\s*/,'') : firstLine(cell.code);
  const title=elem('span',{class:'cell-title',text:label});
  const actions=elem('div',{class:'cell-actions'},[
    mkAction('chevron','Collapse',()=>toggleCollapse(cell.id),'collapse-btn'),
  ]);
  const header=elem('div',{class:'cell-header'},[badge,title,actions]);
  const body=elem('div',{class:'cell-editor'});
  const out=elem('div',{class:'cell-output'});
  const cellEl=elem('div',{class:'cell','data-id':cell.id},[header,body,out]);
  if (cell.collapsed) cellEl.classList.add('collapsed');
  if (cell.type==='code'){
    body.appendChild(elem('pre',{class:'code-plain',text:cell.code}));
    setTimeout(()=>upgradeCode(cellEl,cell),0);
  } else {
    renderMd(cellEl,cell);
  }
  return cellEl;
}
function toggleCollapse(id){
  const c=allCells().find(x=>x.id===id); if(!c)return;
  c.collapsed=!c.collapsed;
  const el=$(`.cell[data-id="${id}"]`); if(el) el.classList.toggle('collapsed',c.collapsed);
}
function collapseAll(){
  const f=currentFile(); if(!f) return;
  const cells=f.doc.cells;   // only the rendered file — state and DOM stay in step
  const anyOpen=cells.some(c=>!c.collapsed);
  cells.forEach(c=>c.collapsed=anyOpen);
  $$('.cell').forEach(el=>el.classList.toggle('collapsed',anyOpen));
}
// One slim boundary row per file, linking to the authored file at this ref.
function fileRow(f){
  return elem('div',{class:'file-row','data-file':f.name},[
    elem('span',{class:'fname',text:'src/'+f.name}),
    elem('a',{href:`https://github.com/${REPO}/blob/${REF}/src/${f.name}`,target:'_blank',rel:'noopener',text:'view on GitHub →'}),
  ]);
}
// Render the CURRENT file — once per fetch or file switch. No structural ops.
function renderNotebook(opts={}){
  const scroll=$('#nb-scroll'); scroll.innerHTML='';
  const f=currentFile(); if(!f) return;
  scroll.appendChild(fileRow(f));
  f.doc.cells.forEach(cell=>scroll.appendChild(createCellEl(cell)));
  if(!opts.skipOutline) renderOutline();
}

/* ════════════════════════════════════════════════════════════════════════════
 * 6c. RIGHT PANE — Preview: each file's markdown rendered whole, one
 *    continuous document with no cell chrome. The cells are the structural
 *    view; this is the reading view of the same bytes.
 * ════════════════════════════════════════════════════════════════════════════ */
function rightOpen(){ return !$('#right-pane').classList.contains('collapsed'); }
function renderPreview(){
  const body=$('#preview-body'); if(!body) return; body.innerHTML='';
  if(!nb.files.length){ body.appendChild(panePlaceholder('md','Nothing loaded yet','Fetching src/*.md …')); return; }
  nb.files.forEach(f=>{
    body.appendChild(elem('div',{class:'preview-file out-md',html:renderMarkdownHTML(f.raw != null ? f.raw : serialize(f.doc))}));
  });
}
function toggleRightPane(){
  const btn=$('#right-activity-bar .activity-bar-btn');
  if (rightOpen()){
    PANES.right.collapse(); btn.classList.remove('active');
    lsSet('servette-src:rightOpen','');
  } else {
    PANES.right.expand(); btn.classList.add('active');
    lsSet('servette-src:rightOpen','1');
    renderPreview();
  }
}

/* ════════════════════════════════════════════════════════════════════════════
 * 6b. ACTIVITY-BAR PANELS — Navigator: a file accordion (exactly one file
 *    expanded; its cells listed beneath, and only its cells in the notebook
 *    DOM — see expandFile) with search across ALL files layered on top. A
 *    query of 2+ characters swaps the accordion for grouped results; clearing
 *    it swaps back.
 * ════════════════════════════════════════════════════════════════════════════ */
function flashCell(el){
  if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function cellRowLabel(c){
  return c.type==='md' ? (firstLine(c.code).replace(/^#+\s*/,'')||'Markdown') : (firstLine(c.code)||'(empty)');
}
function cellRow(fileName, c, label){
  const row=elem('div',{class:'list-row clickable indent',title:label},[
    elem('span',{class:'ol-dot '+c.type}),
    elem('span',{class:'grow mono',text:label}),
  ]);
  row.onclick=()=>gotoCell(fileName, c.id);
  return row;
}
// Navigate to a cell wherever it lives: switch the expanded file first if
// needed (skipOutline keeps search results on screen), then flash it.
function gotoCell(fileName, id){
  if(nb.current!==fileName) expandFile(fileName,{skipOutline: !!nb.query.trim()});
  requestAnimationFrame(()=>flashCell($(`.cell[data-id="${id}"]`)));
}
function renderOutline(){
  const wrap=$('#outline-list'); if(!wrap) return; wrap.innerHTML='';
  if(!nb.files.length){ wrap.appendChild(panePlaceholder('list','Nothing loaded yet','Fetching src/*.md …')); return; }
  const q=nb.query.trim().toLowerCase();
  if(q.length>=2){ renderSearchResults(wrap,q); return; }
  nb.files.forEach(f=>{
    const expanded=f.name===nb.current;
    const frow=elem('div',{class:'list-row file clickable'+(expanded?' expanded':''),title:'src/'+f.name},[
      elem('span',{class:'nav-chev',html:svg('chevron')}),
      elem('span',{class:'grow mono',text:f.name}),
      elem('span',{class:'sub',text:f.doc.cells.length}),
    ]);
    frow.onclick=()=>{ if(expanded) $('#nb-body').scrollTop=0; else expandFile(f.name); };
    wrap.appendChild(frow);
    if(expanded) f.doc.cells.forEach(c=>wrap.appendChild(cellRow(f.name, c, cellRowLabel(c))));
  });
}
// Case-insensitive substring search over every cell of every file — all the
// data is already in memory. One row per matching cell, showing the first
// matching line; grouped under non-collapsible file headers.
function renderSearchResults(wrap,q){
  let total=0;
  nb.files.forEach(f=>{
    const hits=f.doc.cells.map(c=>{
      if(!c.code.toLowerCase().includes(q)) return null;
      const line=(c.code.split('\n').find(l=>l.toLowerCase().includes(q))||'').trim().slice(0,70);
      return {c, line};
    }).filter(Boolean);
    if(!hits.length) return;
    wrap.appendChild(elem('div',{class:'list-row file',title:'src/'+f.name},[
      elem('span',{class:'grow mono',text:f.name}),
      elem('span',{class:'sub',text:hits.length}),
    ]));
    hits.forEach(h=>{ wrap.appendChild(cellRow(f.name, h.c, h.line||cellRowLabel(h.c))); total++; });
  });
  if(!total) wrap.appendChild(panePlaceholder('search','No matches','Case-insensitive, across all five files'));
}
function wireSearch(){
  const inp=$('#nav-search'); if(!inp) return;
  inp.addEventListener('input',()=>{ nb.query=inp.value; renderOutline(); });
  inp.addEventListener('keydown',e=>{ if(e.key==='Escape'){ inp.value=''; nb.query=''; renderOutline(); } });
}

/* ════════════════════════════════════════════════════════════════════════════
 * 6d. REFS — every tag and branch of the repository, from the GitHub API,
 *    fetched lazily the first time the panel opens. Clicking one reloads the
 *    page at ?ref=<name> — everything downstream already derives from REF.
 *    Unauthenticated API calls are rate-limited (60/hr/IP); a failure renders
 *    as a note and the next open retries.
 * ════════════════════════════════════════════════════════════════════════════ */
let _refsLoaded=false;
async function loadRefs(){
  if(_refsLoaded) return;
  _refsLoaded=true;
  const wrap=$('#refs-list'); wrap.innerHTML='';
  wrap.appendChild(panePlaceholder('tag','Loading refs…',''));
  const get=url=>fetch(url).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
  try {
    const [tags,branches]=await Promise.all([
      get(`https://api.github.com/repos/${REPO}/tags?per_page=100`),
      get(`https://api.github.com/repos/${REPO}/branches?per_page=100`),
    ]);
    wrap.innerHTML='';
    renderRefGroup(wrap,'Tags',tags.map(t=>t.name),'tag');
    renderRefGroup(wrap,'Branches',branches.map(b=>b.name),'branch');
    if(!tags.length&&!branches.length) wrap.appendChild(panePlaceholder('tag','No refs found',''));
    wrap.appendChild(elem('div',{class:'pane-note',text:'Viewing a ref renders its authored sources — including branches not yet reviewed.'}));
  } catch(e){
    _refsLoaded=false;   // next open retries
    wrap.innerHTML='';
    wrap.appendChild(panePlaceholder('tag',"Couldn't load refs",
      (e.message||e)+' — the GitHub API rate-limits unauthenticated requests; reopen to retry.'));
  }
}
function renderRefGroup(wrap,label,names,ico){
  if(!names.length) return;
  wrap.appendChild(elem('div',{class:'refs-group',text:label}));
  names.forEach(n=>{
    const cur=n===REF;
    const row=elem('div',{class:'list-row clickable',title:n},[
      elem('span',{class:'ref-ico',html:svg(ico)}),
      elem('span',{class:'grow mono',text:n}),
      cur?elem('span',{class:'cur',text:'viewing'}):null,
    ]);
    row.onclick=()=>{ if(!cur) location.search='?ref='+encodeURIComponent(n); };
    wrap.appendChild(row);
  });
}

/* ════════════════════════════════════════════════════════════════════════════
 * 9. SELF-TESTS — doc-model byte-exactness and cell classification, plus a
 *    live check: every successfully fetched file round-trips byte-exact
 *    (serialize(doc) === the bytes fetched). Results toast; details go to the
 *    browser console (the shell's Console panel left with the runtime).
 * ════════════════════════════════════════════════════════════════════════════ */
function runSelfTests(){
  const res=[]; let pass=0;
  const ok=(n,cond,note)=>{ res.push({n,ok:!!cond,note:cond?'':(note||'')}); if(cond)pass++; };
  // parse→serialize is BYTE-EXACT: serialize(parse(x)) === x (whitespace-stressed)
  [ '', '# H\n\ntext\n', '```python\na = 1\n```\n',
    '\n\n# leading blanks\n\n\n```css\nb{}\n```\n\n\ntrailing prose\n\n',
    '```html\n<b>hi</b>\n```\n\n~~~js\nx\n~~~\n', 'no final newline',
    'text\n```js\nunterminated\n', '```js\n\n```\n' ].forEach((src,i)=>{
    try{ const out=serialize(parse(src)); ok('byte-exact #'+i, out===src, 'serialize(parse(x)) !== x'); }
    catch(e){ ok('byte-exact #'+i,false,'threw '+e.message); }
  });
  // cell classification: fences → code cells (with lang), prose → md cells
  try { const d=parse('# hi\n\n```python\n1\n```\n\n```css\na{}\n```');
    ok('classifies cells', d.cells.length===3 && d.cells[0].type==='md' && d.cells[1].type==='code' && d.cells[1].lang==='python' && d.cells[2].lang==='css'); }
  catch(e){ ok('classify',false,e.message); }
  // the live documents round-trip — the viewer shows the file, byte for byte
  nb.files.filter(f=>!f.error).forEach(f=>{
    try{ ok('round-trip src/'+f.name, serialize(f.doc)===f.raw, 'serialize(doc) !== fetched bytes'); }
    catch(e){ ok('round-trip src/'+f.name,false,'threw '+e.message); }
  });
  res.forEach(r=>console[r.ok?'log':'error']((r.ok?'✓ ':'✗ ')+r.n+(r.note?' — '+r.note:'')));
  toast(pass===res.length?('All '+res.length+' tests passed'):(res.length-pass)+' test(s) failed — see browser console', pass===res.length?'':'err');
  return pass===res.length;
}

/* ════════════════════════════════════════════════════════════════════════════
 * 10. WIRING + BOOT
 * ════════════════════════════════════════════════════════════════════════════ */
function switchTab(name){
  $$('#left-activity-bar .activity-bar-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  $$('#left-pane .pane-panel').forEach(p=>p.classList.toggle('active',p.dataset.tab===name));
}
// Open a left tab and ensure the pane is expanded.
function openTab(name){ switchTab(name); if(PANES.left && PANES.left.isCollapsed()) PANES.left.expand(); lsSet('servette-src:leftTab',name); }

/* ── Panes — oracle-style: drag to resize (clamped + persisted), and the
 *    activity-bar buttons collapse/expand the pane. ── */
const PANES = {};
function setupPane(side){
  const isLeft = side==='left';
  const pane = $('#'+(isLeft?'left-pane':'right-pane'));
  const resizer = $('#'+(isLeft?'left-resizer':'right-resizer'));
  const KEY = 'servette-src:'+side+'Width';
  const MIN = isLeft ? 190 : 300;
  const maxW = () => isLeft ? 520 : Math.max(MIN, window.innerWidth - $('#left-pane').offsetWidth - 88 - 320);
  const clamp = w => Math.max(MIN, Math.min(maxW(), w));
  let saved = clamp(parseInt(lsGet(KEY,''),10) || (isLeft?248:460));
  if (!pane.classList.contains('collapsed')) pane.style.width = saved+'px';
  const isCollapsed = () => pane.classList.contains('collapsed');
  function collapse(){ if(isCollapsed())return; saved=pane.offsetWidth; lsSet(KEY,saved); pane.classList.add('collapsed'); resizer.style.display='none'; }
  function expand(){ pane.classList.remove('collapsed'); pane.style.width=clamp(saved)+'px'; resizer.style.display=''; }
  let drag=false, sx=0, sw=0;
  resizer.addEventListener('mousedown',e=>{ if(isCollapsed())return; drag=true; sx=e.clientX; sw=pane.offsetWidth; resizer.classList.add('dragging'); pane.style.transition='none'; document.body.style.cursor='col-resize'; document.body.style.userSelect='none'; e.preventDefault(); });
  window.addEventListener('mousemove',e=>{ if(!drag)return; const dx=isLeft?(e.clientX-sx):(sx-e.clientX); pane.style.width=clamp(sw+dx)+'px'; });
  window.addEventListener('mouseup',()=>{ if(!drag)return; drag=false; resizer.classList.remove('dragging'); pane.style.transition=''; document.body.style.cursor=''; document.body.style.userSelect=''; saved=pane.offsetWidth; lsSet(KEY,saved); });
  return PANES[side]={collapse,expand,isCollapsed};
}
function wireActivityBars(){
  $$('#left-activity-bar .activity-bar-btn').forEach(btn=>{
    btn.onclick=()=>{
      const tab=btn.dataset.tab;
      if (!PANES.left.isCollapsed() && btn.classList.contains('active')){
        PANES.left.collapse();
        $$('#left-activity-bar .activity-bar-btn').forEach(b=>b.classList.remove('active'));
        lsSet('servette-src:leftTab','');
      } else {
        switchTab(tab);
        if (PANES.left.isCollapsed()) PANES.left.expand();
        lsSet('servette-src:leftTab',tab);
        if (tab==='refs') loadRefs();   // lazy — the shell's Settings-open pattern
      }
    };
  });
}
function restorePanes(){
  const lt=lsGet('servette-src:leftTab', undefined);
  if (lt===''){ PANES.left.collapse(); $$('#left-activity-bar .activity-bar-btn').forEach(b=>b.classList.remove('active')); }
  else if (lt){ switchTab(lt); if(lt==='refs') loadRefs(); }   // restored tab needs the same lazy load a click gets
  if (lsGet('servette-src:rightOpen','1')===''){   // Preview open by default
    PANES.right.collapse();
    $('#right-activity-bar .activity-bar-btn').classList.remove('active');
  }
}
// Status pill (kept from the shell's runtime chrome): idle (gray) ·
// loading (amber) · ready (green) · error (red).
function setPill(el, state, label){
  if (!el) return;
  const cls = state==='loading' ? ' working' : (state==='running'||state==='ready') ? ' ready' : state==='error' ? ' error' : '';
  el.className = 'status-item' + (el.classList.contains('status-link')?' status-link':'') + cls;
  el.textContent = label;
}
function setSource(state, label){ setPill($('#st-source'), state, label); }
function wire(){
  $('#btn-collapse-all').onclick=collapseAll;
  $('#btn-tests').onclick=runSelfTests;
  wireThemePicker();
  wireSearch();
  setupPane('left'); setupPane('right'); wireActivityBars();
  $('#right-activity-bar .activity-bar-btn').onclick=toggleRightPane;
}

async function boot(){
  const ref=$('#ref-label');
  ref.textContent='src @ '+REF;
  ref.href=`https://github.com/${REPO}/tree/${REF}/src`;
  paintIcons();
  // Static icon-only controls: mirror title → accessible name (elem() does the
  // same for dynamically created ones).
  $$('[title]:not([aria-label])').forEach(el=>el.setAttribute('aria-label', el.title));
  wire();
  restorePanes();
  await fetchSources();
  renderNotebook();
  if (rightOpen()) renderPreview();
  loadMarked();
  // expose for console / automation (the browser-verify run reads these)
  window.NB = { parse, serialize, renderMarkdownHTML, runSelfTests, get files(){return nb.files;} };
}
boot();
</script>
