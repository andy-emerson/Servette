[build-system]
requires = ["setuptools>=68"]
# The literate build IS the package build: src/_literate_backend.py generates
# servette.py from the Markdown sources, then delegates to setuptools. pip,
# pipx and `python -m build` all enter through it, so there is no generated
# file to commit and no separate build step to forget.
build-backend = "_literate_backend"
backend-path = ["src"]

[project]
name = "servette"
description = "The Simple Secure Static Site Server — a production nanoserver in one readable module"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andy Emerson" }]
keywords = ["static-site", "https", "web-server", "letsencrypt", "acme", "systemd", "raspberry-pi"]
# What PyPI shows a browser and what pip matches against. Development Status
# stays Beta until the first release has run on a real deployment; saying
# Production/Stable before that would be a claim ahead of its evidence.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: System :: Systems Administration",
]
dynamic = ["version"]
# The floor is 48.0.1: the lowest release whose statically-linked OpenSSL
# carries no published advisory. Bundled OpenSSL is in Servette's process no
# matter which APIs are called, so it sets the hard floor; every advisory fixed
# above 48.0.1 (CVE-2026-69247 in PKCS#7 decryption, CVE-2026-69248/-69249 in
# the X.509 chain verifier) sits in APIs Servette never calls — it does X.509
# load/generate, Ed25519 verification, RSA signing for ACME, and nothing else.
# If Servette ever starts calling the verifier or PKCS#7 APIs, this floor must
# be re-derived (DECISIONS.md, "The cryptography floor is 48.0.1").
#
# No upper bound, deliberately. The previous `<50.0` ceiling is what turned a
# routine dependency lag into a Dependabot alert: it excluded the fixed
# releases outright. A ceiling on a security-critical dependency has to be
# actively maintained or it becomes exactly that trap. CI is the guard instead
# — the full suite runs on every push against whatever cryptography resolves
# to, so a breaking release is caught here rather than by an operator, and a
# pipx install takes the newest release regardless of the floor.
dependencies = ["cryptography>=48.0.1"]

[project.scripts]
servette = "servette:main"

[project.urls]
Homepage = "https://servette.org"
Source = "https://github.com/andy-emerson/Servette"
Issues = "https://github.com/andy-emerson/Servette/issues"

[tool.setuptools]
# One module: the program is a single servette.py, generated by the backend
# above. Nothing to carry as data — the error page is inlined into the module
# at build time (src/build.py), so the wheel is Python only and there is no
# file beside the code for an operator to delete.
py-modules = ["servette"]

[tool.setuptools.dynamic]
version = { attr = "servette.__version__" }
