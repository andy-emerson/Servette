[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servette"
description = "The Simple Secure Static Site Server — a production nanoserver in one readable module"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andy Emerson" }]
keywords = ["static-site", "https", "web-server", "letsencrypt", "acme", "systemd", "raspberry-pi"]
# What PyPI shows a browser and what pip matches against. Development Status
# stays Beta until the first release has run on a real deployment; saying
# Production/Stable before that would be a claim ahead of its evidence.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: System :: Systems Administration",
]
dynamic = ["version"]
# No upper bound, deliberately. The previous `<50.0` ceiling is what turned a
# routine dependency lag into a vulnerability: CVE-2026-69247 affects every
# cryptography below 50.0.0, so the ceiling excluded the only fixed version and
# pinned Servette to vulnerable releases. A ceiling on a security-critical
# dependency has to be actively maintained or it becomes exactly that trap. CI
# is the guard instead — the full suite runs on every push against whatever
# cryptography resolves to, so a breaking release is caught here rather than by
# an operator. The floor is 50.0 because nothing below it is unaffected.
dependencies = ["cryptography>=50.0"]

[project.scripts]
servette = "servette:main"

[project.urls]
Homepage = "https://servette.org"
Source = "https://github.com/andy-emerson/Servette"
Issues = "https://github.com/andy-emerson/Servette/issues"

[tool.setuptools]
packages = ["servette"]

# No package-data: the diagnostic page is inlined into the module at build time
# (src/build.py), so the wheel is Python only and there is no file beside the
# code for an operator to delete.

[tool.setuptools.dynamic]
version = { attr = "servette.__version__" }
