name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Empty for the Ubuntu legs (plain VM); an image name runs the same steps
    # inside that OS. debian:12 = Debian's own Python 3.11 and its split
    # python3-venv package — the configuration the bootstrap's apt-get
    # recovery path was written for.
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - { name: "ubuntu · 3.11", python-version: "3.11", container: "" }
          - { name: "ubuntu · 3.14", python-version: "3.14", container: "" }
          - { name: "debian 12",     container: "debian:12" }
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ !matrix.container }}
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the distro's Python
        if: ${{ matrix.container }}
        run: apt-get update -qq && apt-get install -y -qq python3 python3-venv
      - name: Verify servette.py is in sync with src/
        run: python3 src/build.py --check
      - name: Install dependencies
        run: |
          python3 -m venv .servette-env
          .servette-env/bin/pip install --quiet "cryptography>=41.0,<50.0"
      - name: Run tests
        run: .servette-env/bin/python3 tests/test.py
