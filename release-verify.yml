name: Verify Release

# The release gate from #38. Run it two ways:
#   - workflow_dispatch with the draft release's tag, BEFORE publishing —
#     the primary path: a release is published only after this is green.
#   - automatically on release:published — the backstop, in case the
#     draft-stage run was skipped.
# It fails loudly when any release asset is missing, unsigned, mis-signed,
# or drifted from the repository at the release's commit.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to verify (drafts included)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Locate the release and download its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                --jq "map(select(.tag_name == \"$TAG\")) | first")
          if [ -z "$rel" ] || [ "$rel" = "null" ]; then
            echo "FAIL: no release (draft or published) with tag $TAG"; exit 1
          fi
          echo "$rel" | jq -r '.target_commitish' > .release_ref
          mkdir -p assets
          for name in servette.py servette.py.sig demo.html demo.html.sig; do
            id=$(echo "$rel" | jq -r ".assets | map(select(.name == \"$name\")) | first | .id")
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "FAIL: release is missing asset $name"; exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -H "Accept: application/octet-stream" > "assets/$name"
          done

      - name: Check out the repository at the release's commit
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0

      - name: Pin the checkout to the release's commit
        run: |
          set -eu
          ref=$(cat .release_ref)
          cd repo
          git checkout --detach "refs/tags/$TAG" 2>/dev/null \
            || git checkout --detach "$ref" 2>/dev/null \
            || git checkout --detach "origin/$ref"
          echo "Verifying against $(git rev-parse HEAD)"

      - name: Verify signatures, byte-match, version, and build sync
        run: |
          set -eu
          python3 -m pip install --quiet "cryptography>=41.0,<50.0"
          python3 - "$TAG" <<'PYEOF'
          import re, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          tag    = sys.argv[1].lstrip("v")
          repo   = open("repo/servette.py", "rb").read()
          rel    = open("assets/servette.py", "rb").read()
          demo_r = open("repo/site/demo/index.html", "rb").read()
          demo_a = open("assets/demo.html", "rb").read()

          fail = []
          if rel != repo:
              fail.append("released servette.py does not byte-match the repo at the release commit")
          if demo_a != demo_r:
              fail.append("released demo.html does not byte-match site/demo/index.html at the release commit")

          sys.path.insert(0, "repo/src")
          import build
          if build.build("repo/src").encode() != repo:
              fail.append("servette.py at the release commit has drifted from src/")

          m = re.search(rb'^__version__\s*=\s*[\'"]([^\'"]+)[\'"]', rel, re.M)
          if not m or m.group(1).decode() != tag:
              fail.append(f"release tag {tag!r} does not match the released file's __version__")

          m = re.search(rb'^_SIGNING_PUBLIC_KEY\s*=\s*[\'"]([0-9a-f]{64})[\'"]', repo, re.M)
          if not m:
              fail.append("could not find _SIGNING_PUBLIC_KEY in servette.py at the release commit")
          else:
              key = Ed25519PublicKey.from_public_bytes(bytes.fromhex(m.group(1).decode()))
              for name, data in (("servette.py", rel), ("demo.html", demo_a)):
                  try:
                      key.verify(open(f"assets/{name}.sig", "rb").read(), data)
                  except Exception:
                      fail.append(f"{name}.sig does not verify against the pinned public key")

          if b"servette:demo" not in demo_a:
              fail.append("released demo.html lacks the servette:demo marker")

          if fail:
              print("RELEASE VERIFICATION FAILED:")
              for f in fail:
                  print(" -", f)
              sys.exit(1)
          print("Release verified: all four assets present, signatures valid, "
                "bytes match the release commit, version matches the tag, src/ in sync.")
          PYEOF
