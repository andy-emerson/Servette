# Publish site/ to GitHub Pages.
#
# servette.org is the production deployment — a Servette serving this
# repository's site/ folder. This publishes the same folder to Pages as a
# read-only mirror, so the site has a home that survives the box being down.
#
# It replaces the hand-pushed gh-pages branch, which drifted from site/ and
# accumulated build junk (__pycache__, build/, a test servette.toml) because
# nothing kept it honest. There is no branch now: the artifact is built from
# main and handed straight to Pages, so the mirror cannot hold anything the
# repository does not.
#
# One link is dead on the mirror by design: pub/ points at /selftest/, which
# every Servette serves from inside the program. Pages has no Servette behind
# it, so that path exists only on a real deployment.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Minting the deployment's OIDC token and writing the Pages deployment is all
# this workflow may do; the repository itself is read-only to it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. An in-progress deploy is allowed to finish rather
# than being cancelled — it is publishing to production — while runs queued
# behind it collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # site/ is served as authored — no build step, which is the same
      # contract Servette itself serves it under.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
