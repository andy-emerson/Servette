name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify servette.py is in sync with src/
        run: python3 src/build.py --check
      - name: Install dependencies
        run: |
          python3 -m venv .servette-env
          .servette-env/bin/pip install --quiet "cryptography>=41.0,<50.0"
      - name: Run tests
        run: .servette-env/bin/python3 tests/test.py
