name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Empty for the Ubuntu legs (plain VM); an image name runs the same steps
    # inside that OS. debian:12 = Debian's own Python 3.11 — the oldest
    # supported interpreter as its target platform actually ships it.
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          # Every supported minor, inclusive — the gap bit once: 3.13
          # deprecated re.split's positional maxsplit, 3.11 predates the
          # warning and 3.14's run didn't surface it, so the first to see it
          # was an operator's terminal on Debian 13 (which ships 3.13).
          - { name: "ubuntu · 3.11", python-version: "3.11", container: "" }
          - { name: "ubuntu · 3.12", python-version: "3.12", container: "" }
          - { name: "ubuntu · 3.13", python-version: "3.13", container: "" }
          - { name: "ubuntu · 3.14", python-version: "3.14", container: "" }
          - { name: "debian 12",     container: "debian:12" }
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ !matrix.container }}
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the distro's Python
        if: ${{ matrix.container }}
        run: apt-get update -qq && apt-get install -y -qq python3 python3-venv
      - name: Verify the built package is in sync with src/
        run: python3 src/build.py --check
      # README states a line count as the measurable half of "understood by
      # one person". It is a measurement claim, so it is only as good as its
      # latest run — it drifted 106 lines unnoticed once because nothing
      # re-ran it. This is that run. (The website's per-section counts moved
      # to their own repository and cannot be gated from here; --counts
      # prints them for whoever edits that page.)
      - name: Verify README's line count matches src/
        run: python3 src/build.py --check-counts
      - name: Verify the documents name only things that exist
        run: python3 src/build.py --check-docs
      - name: Install the package into a venv (exercises pyproject.toml)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet .
      - name: Console script smoke test
        run: SERVETTE_HOME=. .venv/bin/servette status --json > /dev/null
      # The admin page's checks drive a real browser. Only one leg installs
      # one — the suite skips itself where Playwright or a browser is
      # missing, so the other four stay fast and still run everything else.
      # Ubuntu only: the debian:12 container has no browser dependencies.
      # It installs into .venv, because that is the interpreter the suite
      # runs under; a system-level install would be invisible to it.
      - name: Install a browser for the admin page checks
        if: ${{ matrix.python-version == '3.13' }}
        run: |
          .venv/bin/pip install --quiet playwright
          .venv/bin/playwright install --with-deps chromium
      - name: Run tests
        run: .venv/bin/python3 tests/test.py
